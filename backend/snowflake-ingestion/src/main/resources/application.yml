server:
  port: 8080

spring:
  application:
    name: snowflake-ingestion
  datasource:
    url: jdbc:h2:mem:ingestiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

snowflake:
  url: ${SNOWFLAKE_URL:jdbc:snowflake://<your-account>.snowflakecomputing.com}
  username: ${SNOWFLAKE_USERNAME:<your-username>}
  password: ${SNOWFLAKE_PASSWORD:<your-password>}
  warehouse: COMPUTE_WH
  database: DEMO_DB
  schema: PUBLIC
  role: ACCOUNTADMIN

logging:
  level:
    com.antigravity.snowflake: INFO
    org.springframework.web: INFO
